name: Deploy Coffee Five to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject final site enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          for name, tag in (("index.html", '<script src="./assets/enhancements.js" defer></script>'), ("cardapio/index.html", '<script src="../assets/enhancements.js" defer></script>')):
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              if tag not in text:
                  text = text.replace("</head>", f"  {tag}\n</head>", 1)
                  p.write_text(text, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
